services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: petcare
      POSTGRES_PASSWORD: petcare_local
      POSTGRES_DB: petcare
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petcare -d petcare"]
      interval: 5s
      timeout: 5s
      retries: 15
  migrate:
    build:
      context: .
      target: tools
    environment:
      DATABASE_URL: postgresql://petcare:petcare_local@db:5432/petcare
    command: ["pnpm", "db:migrate"]
    depends_on:
      db:
        condition: service_healthy
  app:
    build:
      context: .
      target: runner
    environment:
      DATABASE_URL: postgresql://petcare:petcare_local@db:5432/petcare
      APP_URL: http://localhost:3000
      AUTH_MODE: disabled
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
volumes:
  postgres_data:
